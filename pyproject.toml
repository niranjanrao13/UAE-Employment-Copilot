[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uae-employment-copilot"
version = "0.1.0"
description = "Source-grounded Arabic/English UAE employment NLP dataset pipeline"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "httpx>=0.27",
  "lxml>=5.2",
  "pydantic>=2.8",
  "PyYAML>=6.0",
  "typer>=0.12",
  "pypdf>=5.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
uae-copilot = "uae_employment.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
